name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  test:
    name: Maven — Build & Test
    runs-on: ubuntu-latest
    outputs:
      maven-report-url: ${{ steps.upload-maven-coverage.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests and verify coverage thresholds
        run: mvn verify

      - name: Upload coverage report
        id: upload-maven-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: "**/target/site/jacoco/jacoco.xml"
          if-no-files-found: ignore
          retention-days: 30

  android:
    name: Android — Build & Test
    runs-on: ubuntu-latest
    outputs:
      android-report-url: ${{ steps.upload-android-coverage.outputs.artifact-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install budinv-model to local Maven repo
        run: |
          mvn install -N -DskipTests
          mvn install -pl budinv-model -DskipTests

      - name: Run tests and verify coverage thresholds
        working-directory: budinv-android
        run: ./gradlew checkCoverage

      - name: Upload coverage report
        id: upload-android-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jacoco-report
          path: budinv-android/app/build/reports/jacoco/reportCoverage/
          retention-days: 30

      - name: Build debug APK
        working-directory: budinv-android
        run: ./gradlew assembleDebug

      - name: Upload APK
        id: upload-apk
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: budinv-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Post APK link to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📦 Debug APK ready: [Download app-debug.apk](${{ steps.upload-apk.outputs.artifact-url }})'
            });

  coverage-report:
    name: Coverage — Post Report
    needs: [test, android]
    runs-on: ubuntu-latest

    steps:
      - name: Download Maven coverage report
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: coverage/maven

      - name: Download Android coverage report
        uses: actions/download-artifact@v4
        with:
          name: android-jacoco-report
          path: coverage/android

      - name: Parse coverage data
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET
          import re, os

          MAVEN_MODULES = [
              ('budinv-model',          'coverage/maven/budinv-model/target/site/jacoco/jacoco.xml'),
              ('budinv-controller',     'coverage/maven/budinv-controller/target/site/jacoco/jacoco.xml'),
              ('budinv-infrastructure', 'coverage/maven/budinv-infrastructure/target/site/jacoco/jacoco.xml'),
              ('budinv-rest-services',  'coverage/maven/budinv-rest-services/target/site/jacoco/jacoco.xml'),
              ('budinv-web',            'coverage/maven/budinv-web/target/site/jacoco/jacoco.xml'),
          ]

          def pct(covered, missed):
              total = covered + missed
              return f"{covered * 100 / total:.1f}%" if total > 0 else "—"

          def parse_jacoco(path):
              with open(path) as f:
                  content = f.read()
              content = re.sub(r'<!DOCTYPE[^>]*>', '', content)
              root = ET.fromstring(content)
              return {
                  c.get('type'): (int(c.get('covered', 0)), int(c.get('missed', 0)))
                  for c in root.findall('counter')
              }

          rows = []
          tl_cov = tl_mis = tb_cov = tb_mis = 0

          for name, path in MAVEN_MODULES:
              if os.path.exists(path):
                  c = parse_jacoco(path)
                  lc, lm = c.get('LINE', (0, 0))
                  bc, bm = c.get('BRANCH', (0, 0))
                  tl_cov += lc; tl_mis += lm; tb_cov += bc; tb_mis += bm
                  rows.append((name, pct(lc, lm), pct(bc, bm)))
              else:
                  rows.append((name, '—', '—'))

          android = 'coverage/android/reportCoverage.xml'
          if os.path.exists(android):
              c = parse_jacoco(android)
              lc, lm = c.get('LINE', (0, 0))
              bc, bm = c.get('BRANCH', (0, 0))
              tl_cov += lc; tl_mis += lm; tb_cov += bc; tb_mis += bm
              rows.append(('Android', pct(lc, lm), pct(bc, bm)))

          body = ['## Test Coverage', '',
                  '| Module | Line | Branch |',
                  '| --- | ---: | ---: |']
          for name, line, branch in rows:
              body.append(f'| `{name}` | {line} | {branch} |')
          body += ['', f'**Overall:** {pct(tl_cov, tl_mis)} lines &nbsp; {pct(tb_cov, tb_mis)} branches']

          with open('coverage-comment.md', 'w') as f:
              f.write('\n'.join(body))
          PYEOF

      - name: Post coverage comment to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('coverage-comment.md', 'utf8');
            body += '\n\n---\n📊 Full reports: [Maven](${{ needs.test.outputs.maven-report-url }}) | [Android](${{ needs.android.outputs.android-report-url }})';

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body && c.body.startsWith('## Test Coverage'));
            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
